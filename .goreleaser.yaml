---
version: 2
project_name: dodo

before:
  hooks:
    - go mod download
    - go generate ./...

builds:
  - id: main
    main: ./cmd/dodo
    env: ["CGO_ENABLED=0"]
    goos: [linux, darwin]
    ldflags:
      - -s -w
      - -X go.szostok.io/version.version={{.Version}}
      - -X go.szostok.io/version.buildDate={{.Date}}

archives:
  - ids: [main]
    formats: [binary]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
